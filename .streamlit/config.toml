[theme]
primaryColor = "#10B981"
backgroundColor = "#F8F9FA"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#111827"
font = "sans serif"

[client]
showErrorDetails = false
maxUploadSize = 200

[server]
headless = true
port = 8502
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
serverAddress = "localhost"
serverPort = 8502

[logger]
level = "info"
